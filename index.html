<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upcoming Research Publications</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="src/app.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <header class="bg-white border-bottom py-4">
    <div class="container">
      <h1 class="h2 mb-1">Upcoming Research Publications</h1>
      <p class="text-secondary mb-0">
        Manage upcoming research entries for the NISRA release calendar.
      </p>
    </div>
  </header>

  <main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="h4 mb-0">Current entries</h2>

      <button
        id="add-entry"
        type="button"
        class="btn btn-primary"
      >
        Add publication
      </button>
    </div>

    <div id="status-message" class="mb-3">
      Loading publications…
    </div>

    <div id="publication-list"></div>

    <div
  class="modal fade"
  id="publication-modal"
  tabindex="-1"
  aria-labelledby="publication-modal-title"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <form id="publication-form" novalidate>

        <div class="modal-header">
          <h2 class="modal-title fs-5" id="publication-modal-title">
            Add publication
          </h2>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <div class="modal-body">

          <div class="mb-3">
            <label for="title" class="form-label">
              Title
            </label>
            <input
              type="text"
              class="form-control"
              id="title"
              required
            >
            <div class="invalid-feedback">
              Enter a title.
            </div>
          </div>

          <div class="mb-3">
            <label for="summary" class="form-label">
              Summary
            </label>
            <textarea
              class="form-control"
              id="summary"
              rows="4"
              required
            ></textarea>
            <div class="invalid-feedback">
              Enter a summary.
            </div>
          </div>

          <div class="mb-3">
            <label for="url" class="form-label">
              URL
            </label>
            <input
              type="url"
              class="form-control"
              id="url"
              placeholder="https://..."
            >
            <div class="invalid-feedback">
              Enter a valid URL.
            </div>
          </div>

          <fieldset class="mb-3">
            <legend class="form-label">
              Publication timing
            </legend>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="date-type"
                id="date-type-exact"
                value="exact"
                checked
              >
              <label class="form-check-label" for="date-type-exact">
                Exact date
              </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="date-type"
                id="date-type-month"
                value="month"
              >
              <label class="form-check-label" for="date-type-month">
                One-month window
              </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="date-type"
                id="date-type-range"
                value="range"
              >
              <label class="form-check-label" for="date-type-range">
                Two-month window
              </label>
            </div>
          </fieldset>

          <div id="exact-date-fields" class="mb-3">
            <label for="exact-date" class="form-label">
              Publication date
            </label>
            <input
              type="date"
              class="form-control"
              id="exact-date"
            >
          </div>

          <div id="month-date-fields" class="mb-3 d-none">
            <label for="publication-month" class="form-label">
              Publication month
            </label>
            <input
              type="month"
              class="form-control"
              id="publication-month"
            >
          </div>

          <div id="range-date-fields" class="row g-3 mb-3 d-none">
            <div class="col-md-6">
              <label for="range-start" class="form-label">
                From
              </label>
              <input
                type="month"
                class="form-control"
                id="range-start"
              >
            </div>

            <div class="col-md-6">
              <label for="range-end" class="form-label">
                To
              </label>
              <input
                type="month"
                class="form-control"
                id="range-end"
              >
            </div>
          </div>

          <div class="mb-3">
            <label for="organisation" class="form-label">
              Organisation
            </label>
            <select
              class="form-select"
              id="organisation"
              required
            >
              <option value="">Choose an organisation</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="status" class="form-label">
              Status
            </label>
            <select
              class="form-select"
              id="status"
              required
            >
              <option value="Provisional">Provisional</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Delayed">Delayed</option>
            </select>
          </div>

          <div class="alert alert-secondary mb-0">
            <strong>Generated values</strong>

            <div class="mt-2">
              Display date:
              <span id="display-date-preview">—</span>
            </div>

            <div>
              Release date:
              <span id="release-date-preview">—</span>
            </div>
          </div>

        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-primary"
          >
            Save
          </button>
        </div>

      </form>

    </div>
  </div>
</div>

  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
